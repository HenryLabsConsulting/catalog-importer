name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff pytest flask

      - name: Lint
        run: ruff check importer web

      - name: Unit tests
        run: pytest -q

      - name: CLI smoke test on the sample file
        run: |
          python -m importer.cli samples/supplier_products_messy.csv --out /tmp/out.csv
          head -1 /tmp/out.csv | grep -q "sku,name,price"
          test "$(wc -l < /tmp/out.csv)" -gt 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the app via docker compose
        run: docker compose up -d --build

      - name: Wait for the web UI
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8090/; then
              exit 0
            fi
            sleep 2
          done
          echo "web UI did not come up in time" >&2
          docker compose logs
          exit 1

      - name: GET / returns 200
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8090/)
          test "$status" = "200"

      - name: Convert the sample messy CSV through the running app
        run: |
          curl -sf -X POST http://localhost:8090/convert \
            -F "file=@samples/supplier_products_messy.csv;type=text/csv" \
            -F "mode=all" \
            -o /tmp/result.html
          grep -q '<div class="n">15</div><div class="l">rows read</div>' /tmp/result.html
          grep -q '<div class="n">12</div><div class="l">ready to import</div>' /tmp/result.html
          grep -q 'Skipped rows (3)' /tmp/result.html

      - name: Container logs on failure
        if: failure()
        run: docker compose logs
